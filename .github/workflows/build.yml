name: Build desktop packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            node: 22
          - name: macOS
            os: macos-latest
            node: 22
          - name: Linux
            os: ubuntu-latest
            node: 22

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild

      - name: Build packages
        run: npm run make
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: deskmanager-${{ runner.os }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages from all platforms
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release timestamp
        id: timestamp
        shell: bash
        run: echo "value=$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Summarize changes in this push
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          {
            echo '## 本次变更'
            git log --pretty=format:'- %s (%h)' "${BEFORE_SHA}..${AFTER_SHA}"
            echo
            echo
            echo '## 文件变更统计'
            echo '```text'
            git diff --stat "${BEFORE_SHA}" "${AFTER_SHA}"
            echo '```'
          } > release-notes.md

      - name: Create GitHub Release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.timestamp.outputs.value }}
          name: DeskManager ${{ steps.timestamp.outputs.value }}
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
